<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing table feature</title>

    <style>
        th{
           width : 300px ;
           height : 100px ;
        }
        td{
           width : 300px ;
           height : 100px ;
        }
    </style>
</head>
<body>
    <h3>Store Hours</h3>
    <table bgcolor = "black">
        <tr bgcolor = "grey">
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
        </tr>
        <tr bgcolor = "lightgrey">
            <td>0900-1800</td>
            <td>0900-1800</td>
            <td>Closed</td>
        </tr>
    </table>
</body>
</html>
