<!DOCTYPE html>
<html lang="en">
<head>
    <!-- key: z index & position, CSS Absolute vs Relative Position EXPLAINED!-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image stacking test</title>

    <style>
        #parent{
            position: relative; width: 500px; height: 500px;
            border: 5px;
            background: white;
            border: 2px solid black;
            left: 0px;
        }
        .red{
            background:red; width: 200px; height: 200px;
            position: absolute; top: 80px; left: 50px;z-index : 1;
        }
        .green{
            background:green; width: 200px; height: 200px;
            position: absolute; top: 20px; left: 20px; 
        }
        .car{

            position: absolute; top: 10px; left: 20px; z-index : 3;
        }
        .logo{
            transform: scale(0.5);
            position: absolute; top: -50px; left: -60px; z-index : 2;
        }
    </style>
</head>
<body>
    <div id = "parent">
        <div class = "red"></div>
        <img class = "car" src = "images/car.png"></img>
        <img class = "logo" src = "images/touch.jpeg"></img>

    </div>
</body>
</html>
